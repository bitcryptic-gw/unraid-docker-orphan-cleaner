name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP includes and scripts
        run: |
          set -e
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Classifier unit test
        run: |
          set -e
          php tests/classifier_test.php

      - name: Request fail-safe unit test
        run: |
          set -e
          php tests/request_test.php

      - name: Lint the .page PHP body
        run: |
          set -e
          for page in $(find src -name '*.page'); do
            awk 'body { print } /^---$/ { body = 1 }' "$page" > /tmp/page.php
            php -l /tmp/page.php
          done

      - name: Audit for shell calls in src
        run: |
          set -e
          forbidden='(^|[^A-Za-z0-9_])(exec|shell_exec|system|passthru|popen|pcntl_exec)[[:space:]]*\(|escapeshell(arg|cmd)|`'
          if grep -rInE --include='*.php' --include='*.page' "$forbidden" src/; then
            echo "::error::forbidden shell call found in src/"
            exit 1
          fi
          proc_files="$(grep -rIl 'proc_open' --include='*.php' --include='*.page' src/ | sort | tr '\n' ' ')"
          expected="src/usr/local/emhttp/plugins/docker.orphan.cleaner/include/Exec.php "
          if [ "$proc_files" != "$expected" ]; then
            echo "::error::proc_open must appear only in include/Exec.php (found: ${proc_files:-none})"
            exit 1
          fi
          calls="$(grep -rIohE 'proc_open[[:space:]]*\(' --include='*.php' --include='*.page' src/ | wc -l | tr -d ' ')"
          if [ "$calls" -lt 1 ]; then
            echo "::error::no proc_open call found in src/"
            exit 1
          fi
          echo "OK: no forbidden shell calls; proc_open appears only in include/Exec.php ($calls call(s))"

      - name: Plugins-page README is a short blurb
        run: |
          set -e
          f=src/usr/local/emhttp/plugins/docker.orphan.cleaner/README.md
          nonempty="$(grep -cve '^[[:space:]]*$' "$f")"
          echo "non-empty lines: $nonempty"
          if [ "$nonempty" -gt 4 ]; then
            echo "::error::$f must have at most 4 non-empty lines (has $nonempty)"
            exit 1
          fi
          if grep -qE '^[[:space:]]*(#|\|)' "$f"; then
            echo "::error::$f must not contain heading (#) or table (|) lines"
            exit 1
          fi
          echo "OK: $f is a short blurb"

      - name: Shellcheck
        run: |
          set -e
          shellcheck build/mkpkg.sh

      - name: Validate XML
        run: |
          set -e
          xmllint --noout plugin/docker.orphan.cleaner.plg
          xmllint --noout plugins/docker.orphan.cleaner.xml
          xmllint --noout ca_profile.xml

      - name: VERSION format
        run: |
          set -e
          v="$(tr -d '[:space:]' < VERSION)"
          echo "$v" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          echo "VERSION=$v ok"

      - name: Version matches between VERSION and the .plg
        run: |
          set -e
          file_version="$(tr -d '[:space:]' < VERSION)"
          plg_version="$(grep -oE '<!ENTITY version +"[^"]+"' plugin/docker.orphan.cleaner.plg | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?')"
          echo "VERSION=$file_version plg=$plg_version"
          test "$file_version" = "$plg_version"

      - name: Rebuild package and verify the .plg SHA256 matches
        run: |
          set -e
          python3 build/mkpkg.py
          pkg="$(find build/dist -name '*.txz' | head -n1)"
          sha="$(sha256sum "$pkg" | awk '{print $1}')"
          grep -q "<SHA256>$sha</SHA256>" plugin/docker.orphan.cleaner.plg
          # the committed .plg must already carry this digest
          git diff --exit-code -- plugin/
          echo "built $pkg sha256 $sha"
